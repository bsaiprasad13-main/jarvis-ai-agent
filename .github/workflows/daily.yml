name: Daily Jarvis run

on:
  schedule:
    - cron: "30 4 * * *"        # 10:00 IST
  workflow_dispatch:             # "Run workflow" button
  push:
    branches: [main]
    paths: ["site/**"]           # redeploy the website when its page changes

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jarvis-daily
  cancel-in-progress: false

jobs:
  run:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata           # run ids and dates in India time
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_agent.py
      - name: Run the agents (website only, no email)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRODUCT_HUNT_DEVELOPER_TOKEN: ${{ secrets.PRODUCT_HUNT_DEVELOPER_TOKEN }}
        run: python run.py --no-email
      - name: Save the run (also when a check failed, so the site shows it)
        if: always()
        run: |
          git config user.name "jarvis-bot"
          git config user.email "jarvis-bot@users.noreply.github.com"
          git add site/data
          git add data/memory.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Daily run $(date -u +%F)"
          git push

  deploy:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        continue-on-error: true    # GitHub sometimes can't see a just-uploaded artifact yet
        uses: actions/deploy-pages@v4
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
