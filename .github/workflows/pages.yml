name: Publish website

# The daily run happens on Zoho Catalyst (Job Scheduling, 10:00 IST). GitHub only tests the code and
# publishes the static website when it changes; the page reads each day's report from Catalyst.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff==0.17.6
      - run: ruff check .
      - run: python tests/test_agent.py

  deploy:
    needs: test
    if: github.event_name != 'pull_request'          # pull requests are tested, never published
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        continue-on-error: true    # GitHub sometimes can't see a just-uploaded artifact yet
        uses: actions/deploy-pages@v4
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
